name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck, lint, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check:banned
      - run: npm run format
      - name: Generated types are up to date
        run: npm run gen:types && git diff --exit-code src/types/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # E2E uses locally hosted ArcGIS assets so results do not depend on CDN availability.
      # The deployed site uses the Esri CDN (ADR-14) and is smoke-tested after deploy.
      - name: Build (local ArcGIS assets)
        run: npm run build
        env:
          VITE_ARCGIS_ASSETS: local

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  pipeline:
    name: Data pipeline (pytest, manifest check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
