name: Fetch reference data (ONS, Nomis, MHCLG, NISRA, FSA, Defra, World Bank, DfT, Scottish Government, EMODnet, OS)

# Downloads the reference files the app needs into pipeline/raw/<publisher>/<snapshot>/ and commits
# them to the branch:
# - ONS (S14, S15, S18): mid-year population, LAD lookup and council boundaries (Stage 4); LSOA
#   lookup, boundaries and population-weighted centroids for the Manchester deep profile (Stage 5);
# - Nomis (S18, S20): Census 2021 TS001 and TS045 bulk zips (Stage 5);
# - MHCLG (S19): English Indices of Deprivation 2025, File 7 (Stage 5);
# - NISRA (S16, S18, S19): Data Zone and SOA 2011 boundaries, Data Zone centroids, MS-A01 and
#   NIMDM 2017 (Stage 5);
# - FSA (S29): food hygiene register files for the 11 Northern Ireland councils (NI grocers that
#   GEOLYTIX misses; John, 25 Oct 2026).
# Those make up the `stage5` set (snapshot 2026-10-24). The `context` set (snapshot 2026-10-25;
# John, 25 Oct 2026) adds the ONS 2021 Rural Urban Classification of councils and LSOAs (S21) and
# Defra's annual production statistics (S09 horticulture, S10 Agriculture in the UK, chapter 7).
# The `stage6` set (snapshot 2026-10-25; John's Stage 6 brief and decisions, 25 Oct 2026) adds FAO
# water stress through the World Bank API (S30), DfT port freight tables (S23), UKFSR 2024 theme 3
# (S03), Defra June survey structure results (S31), the Scottish 2022 and 2011 Data Zone lookups
# (S32), EMODnet port locations (S36), ONS ITL1 regions (S33) and the LSOA-to-council lookup for
# every LSOA (S15), and an extract of OS Open Roads (S35). OSNI's transport service (S34) refused
# the runners in three runs and its ArcGIS Hub download answered HTTP 400, so it is left out of the
# set (Northern Ireland roads are not shown). The NIR railway network comes from OpenDataNI (S37).
# The `trade` set (snapshot 2026-10-26; John, 26 Oct 2026: the other eleven Food Origins baskets)
# adds Defra's trade codes and descriptions (S05, gate G3) and Agriculture in the UK chapter 8,
# livestock (S10: meat and dairy supply).
# The `stage7` set (snapshot 2026-10-26; John's Stage 7 brief and decision, 26 Oct 2026) adds every
# LSOA population-weighted centroid in England and Wales (S15) and the Scottish Government's Data Zone
# Centroids 2022 with Census 2022 population (S17), for UK-wide small areas in the Scenario Lab.
# SNAPSHOT and SET below name the set this branch fetches; earlier sets stay in their own folders.
# The build sandbox cannot reach these sites; everything after this download runs offline from the
# cache (same pattern as the HMRC ingest, ADR-0016). Data reaches `main` only through a pull request.
#
# Trigger: push to a `data/**` branch. The fetch is incremental: items already in a snapshot's
# index.json are verified and not downloaded again, so the commit this job pushes back finds
# nothing new and does not start another download. Each publisher's folder is complete or
# unchanged: what downloaded is committed even when another publisher failed, and the job then fails.

on:
  push:
    branches: ["data/**"]

permissions:
  contents: write

concurrency:
  group: refresh-reference-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch reference files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPSHOT: "2026-10-26"
      SET: "stage7"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync --locked

      - name: Download
        id: download
        continue-on-error: true
        working-directory: pipeline
        run: uv run foodscope-pipeline fetch-reference --snapshot "$SNAPSHOT" --set "$SET"

      - name: OS Open Roads extract (stage6 set)
        id: roads
        if: env.SET == 'stage6'
        continue-on-error: true
        working-directory: pipeline
        run: uv run foodscope-pipeline fetch-open-roads --snapshot "$SNAPSHOT"

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          snap = os.environ["SNAPSHOT"]
          for publisher in ("ons", "nomis", "mhclg", "nisra", "fsa", "defra", "worldbank", "dft", "scotgov", "emodnet", "os", "osni", "translink"):
              path = pathlib.Path(f"pipeline/raw/{publisher}/{snap}/index.json")
              print(f"### {publisher} {snap}\n")
              if not path.is_file():
                  print("Nothing cached.\n")
                  continue
              for f in json.loads(path.read_text())["files"]:
                  print(f"- {f['id']} `{f['file']}`: {f['bytes']:,} bytes, sha256 {f['sha256'][:12]}…, {f['url']}")
              print()
          PY

      - name: Commit to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/raw
          if git diff --cached --quiet; then
            echo "::notice::No changes."
          else
            git commit -m "data(reference): raw reference files $SNAPSHOT" \
              -m "Downloaded by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Fail if a download failed
        if: steps.download.outcome == 'failure' || steps.roads.outcome == 'failure'
        run: |
          echo "::error::At least one publisher's download failed; see the Download step's log."
          exit 1
