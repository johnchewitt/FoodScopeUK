[project]
name = "foodscope-pipeline"
version = "0.1.0"
description = "FOODSCOPE UK data pipeline: ingest, validate, derive and publish dated data snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.25.1",
]

[project.scripts]
foodscope-pipeline = "foodscope_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foodscope_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
