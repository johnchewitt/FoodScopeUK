[project]
name = "foodscope-pipeline"
version = "0.1.0"
description = "FOODSCOPE UK data pipeline: ingest, validate, derive and publish dated data snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.25.1",
    "openpyxl==3.1.5",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
    "shapely==2.2.0",
    "xlrd==2.0.1",
]

[project.scripts]
foodscope-pipeline = "foodscope_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
# Resolve only releases published before this date (supply-chain guard: no packages younger than
# about two weeks when the lock was last changed). Move it forward deliberately when updating.
exclude-newer = "2026-10-11T00:00:00Z"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foodscope_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
